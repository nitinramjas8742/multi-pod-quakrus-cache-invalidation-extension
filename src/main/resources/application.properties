quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/agencydb}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}

quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.second-level-caching-enabled=true

# Redis Configuration
quarkus.redis.hosts=redis://localhost:6379

# Debezium (disabled in favor of the Redis version/epoch invalidation protocol)
# quarkus.debezium.plugin.name=pgoutput
# quarkus.debezium.snapshot.mode=no_data