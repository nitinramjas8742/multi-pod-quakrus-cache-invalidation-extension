plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.example'
version = '1.1.1'
base.archivesName = 'redis-cache-runtime'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('io.quarkus.platform:quarkus-bom:3.37.0')
    implementation 'io.quarkus:quarkus-core'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-hibernate-orm'
    implementation 'io.quarkus:quarkus-redis-client'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'redis-cache-runtime'
            from components.java
        }
    }
    repositories {
        // Local drop-in Maven repository: build/extension-repo
        maven {
            name = 'extensionRepo'
            url = rootProject.uri('build/extension-repo')
        }
    }
}
